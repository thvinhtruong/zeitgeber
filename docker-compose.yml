services:
  activity-detector:
    build: .
    container_name: activity-detector
    volumes:
      - ./data:/data
    # optional: enables the AI S.M.A.R.T review on goals (read from your shell or .env)
    env_file:
      - .env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: activity-detector-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/vinhtruong.localhost.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/00-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
    depends_on:
      - activity-detector
    restart: unless-stopped
